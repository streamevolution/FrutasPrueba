// FUNCIONES PARA CALCULAR RFC AUTOMÁTICO
// ==========================================
function quitarArticulos(palabra) {
    if (!palabra) return '';
    palabra = palabra.replace(/^(DE|LA|LAS|MAC|MC|VAN|VON|Y)\s+/i, '');
    palabra = palabra.replace(/\s+(DE|LA|LAS|MAC|MC|VAN|VON|Y)\s+/gi, ' ');
    return palabra;
}

function calcularHomoclave(nombreCompleto) {
    const tabla = {
        ' ': '00', '0': '00', '1': '01', '2': '02', '3': '03', '4': '04', '5': '05', '6': '06', '7': '07', '8': '08', '9': '09',
        '&': '10', 'A': '11', 'B': '12', 'C': '13', 'D': '14', 'E': '15', 'F': '16', 'G': '17', 'H': '18', 'I': '19', 'J': '21',
        'K': '22', 'L': '23', 'M': '24', 'N': '25', 'O': '26', 'P': '27', 'Q': '28', 'R': '29', 'S': '32', 'T': '33', 'U': '34',
        'V': '35', 'W': '36', 'X': '37', 'Y': '38', 'Z': '39', 'Ñ': '40'
    };
    let cadenaNums = "0";
    for (let i = 0; i < nombreCompleto.length; i++) {
        cadenaNums += tabla[nombreCompleto.charAt(i)] || '00';
    }
    let suma = 0;
    for (let i = 0; i < cadenaNums.length - 1; i++) {
        let v1 = parseInt(cadenaNums.substring(i, i + 2));
        let v2 = parseInt(cadenaNums.substring(i + 1, i + 2));
        suma += (v1 * v2);
    }
    let tresUltimos = suma % 1000;
    let cociente = Math.floor(tresUltimos / 34);
    let residuo = tresUltimos % 34;
    const eq = "123456789ABCDEFGHIJKLMNPQRSTUVWXYZ";
    return eq.charAt(cociente) + eq.charAt(residuo);
}

function calcularDigitoVerificador(rfc12) {
    const dic = "0123456789ABCDEFGHIJKLMN&OPQRSTUVWXYZ Ñ";
    let suma = 0;
    for (let i = 0; i < 12; i++) {
        let valor = dic.indexOf(rfc12.charAt(i));
        suma += (valor * (13 - i));
    }
    let residuo = suma % 11;
    if (residuo === 0) return '0';
    let digito = 11 - residuo;
    if (digito === 10) return 'A';
    return digito.toString();
}

function generarRFCAutomatico(nombre, apellidoP, apellidoM, fechaNacimiento) {
    nombre = (nombre || '').toUpperCase().trim();
    apellidoP = (apellidoP || '').toUpperCase().trim();
    apellidoM = (apellidoM || '').toUpperCase().trim();
    
    let paternoLimpio = quitarArticulos(apellidoP) || 'X';
    let maternoLimpio = quitarArticulos(apellidoM) || 'X';
    let nombreLimpio = quitarArticulos(nombre) || 'X';

    let rfc = paternoLimpio.charAt(0);
    let vocalPaterno = paternoLimpio.substring(1).match(/[AEIOU]/);
    rfc += vocalPaterno ? vocalPaterno[0] : 'X';
    rfc += maternoLimpio.charAt(0);
    rfc += nombreLimpio.charAt(0);

    let partesFecha = fechaNacimiento.split('-');
    if(partesFecha.length === 3) {
        let [anio, mes, dia] = partesFecha;
        rfc += anio.substring(2) + mes + dia;
    } else {
        rfc += '000000'; 
    }

    let nombreCompleto = `${apellidoP} ${apellidoM} ${nombre}`.replace(/Ñ/g, 'N');
    let homoclave = calcularHomoclave(nombreCompleto);
    rfc += homoclave;
    
    let digito = calcularDigitoVerificador(rfc);
    return rfc + digito;
}

        // COMPONENTE: TRANSFERIR SALDO

        const TransferFlow = ({ onBack, userData }) => {
            const [email, setEmail] = useState('');
            const [amount, setAmount] = useState('');
            const [isLoading, setIsLoading] = useState(false);
            const [step, setStep] = useState(1);
            const [showConfirm, setShowConfirm] = useState(false);
            const [errorMsg, setErrorMsg] = useState(null); // NUEVO ESTADO PARA ERRORES

            // Actualizamos los íconos cada vez que se abra una ventana (incluyendo la de error)
            useEffect(() => { if(window.lucide) window.lucide.createIcons(); }, [step, showConfirm, errorMsg]);

            const COMISION = 10;
            const MINIMO_ENVIO = 50;

            const handleTransferClick = (e) => {
                e.preventDefault();
                
                const transferAmount = parseFloat(amount);
                
                if (isNaN(transferAmount) || transferAmount <= 0) {
                    setErrorMsg("Por favor ingresa un monto válido.");
                    return;
                }

                if (transferAmount < MINIMO_ENVIO) {
                    setErrorMsg(`La transferencia mínima permitida es de $${MINIMO_ENVIO.toFixed(2)} pesos.`);
                    return;
                }

                const totalADescontar = transferAmount + COMISION;
                if (totalADescontar > (userData?.saldo || 0)) {
                    setErrorMsg(`Saldo insuficiente.\n\nRecuerda que se te descuenta lo que envías ($${transferAmount}) + una comisión de envío ($${COMISION}).`);
                    return;
                }
                
                const currentUser = firebase.auth().currentUser;
                if (!currentUser) return;
                
                const userEmail = currentUser.email || "";
                if (email.toLowerCase().trim() === userEmail.toLowerCase().trim()) {
                    setErrorMsg("No puedes transferir saldo a tu propia cuenta.");
                    return;
                }

                setShowConfirm(true);
            };

            const executeTransfer = async () => {
                setShowConfirm(false);
                setIsLoading(true);
                
                const transferAmount = parseFloat(amount);
                const totalADescontar = transferAmount + COMISION;
                
                const currentUser = firebase.auth().currentUser;
                const userEmail = currentUser.email || "";

                try {
                    const usersRef = db.collection('usuarios');
                    const snapshot = await usersRef.where('email', '==', email.toLowerCase().trim()).get();
                    
                    if (snapshot.empty) {
                        // AQUÍ REEMPLAZAMOS EL ALERT FEO POR NUESTRO MODAL
                        setErrorMsg("Usuario no encontrado.\n\nVerifica que el correo esté bien escrito y que el usuario esté registrado.");
                        setIsLoading(false);
                        return;
                    }

                    const recipientDoc = snapshot.docs[0];
                    const recipientId = recipientDoc.id;
                    
                    const batch = db.batch();
                    const senderRef = usersRef.doc(currentUser.uid);
                    
                    batch.update(senderRef, { saldo: firebase.firestore.FieldValue.increment(-totalADescontar) });
                    batch.update(recipientDoc.ref, { saldo: firebase.firestore.FieldValue.increment(transferAmount) });
                    
                    const historyRef = db.collection('transferencias').doc();
                    batch.set(historyRef, {
                        senderId: currentUser.uid,
                        senderEmail: userEmail,
                        recipientId: recipientId,
                        recipientEmail: email.toLowerCase().trim(),
                        amount: transferAmount,
                        comisionAplicada: COMISION,
                        date: new Date()
                    });

                    await batch.commit();
                    setStep(2);
                } catch (error) {
                    console.error("Error en transferencia:", error);
                    setErrorMsg("Ocurrió un error de conexión: " + error.message);
                } finally {
                    setIsLoading(false);
                }
            };
            
            const saldoActual = userData?.saldo || 0;
            const saldoAEnviar = parseFloat(amount) || 0;
            const saldoFinal = saldoActual - saldoAEnviar - COMISION;

            return (
                <div className="min-h-screen bg-slate-900 flex items-center justify-center p-4 font-sans relative overflow-hidden z-[100]">

const handleAddField = async () => {
    if (!newFieldInput.trim()) return;
    const fieldToAdd = newFieldInput.trim().toUpperCase();
    if (availableFields.includes(fieldToAdd)) return;
    
    // Lo agrega al principio de la lista para que se vea rápido
    const updatedFields = [fieldToAdd, ...availableFields];
    setAvailableFields(updatedFields);
    setNewFieldInput("");
    
    try {
        await db.collection('configuracion_admin').doc('camposRequeridos').set({ campos: updatedFields });
    } catch (error) {
        console.error("Error al guardar campo:", error);
    }
};

const handleDeleteField = async (fieldToDelete) => {
    const confirmDelete = window.confirm(`¿Estás seguro de que deseas eliminar el campo "${fieldToDelete}" permanentemente?`);
    if (!confirmDelete) return;

    const updatedFields = availableFields.filter(f => f !== fieldToDelete);
    setAvailableFields(updatedFields);
    
    // Lo deselecciona si estaba marcado en el servicio actual
    if (newService.fields && newService.fields.includes(fieldToDelete)) {
        setNewService({ ...newService, fields: newService.fields.filter(f => f !== fieldToDelete) });
    }

    try {
        await db.collection('configuracion_admin').doc('camposRequeridos').set({ campos: updatedFields });
    } catch (error) {
        console.error("Error al eliminar campo:", error);
    }
};

            const handleProcessRecarga = async (req, approved) => {
                if(!confirm(approved ? "¿Aprobar esta recarga?" : "¿Rechazar esta recarga?")) return;
                
                try {
                    // 1. Desaparecer la solicitud de la pantalla INSTANTÁNEAMENTE para evitar confusión
                    setRequests(prev => prev.filter(r => r.id !== req.id));

                    const batch = db.batch();
                    
                    // 2. Actualizar el estado en la base de datos de forma segura
                    batch.update(db.collection('recargas').doc(req.id), {
                        status: approved ? 'aprobado' : 'rechazado', 
                        fechaProceso: firebase.firestore.FieldValue.serverTimestamp()
                    });
                    
                    // 3. Sumar el saldo al usuario
                    if(approved && req.userId) {
                        batch.update(db.collection('usuarios').doc(req.userId), {
                            saldo: firebase.firestore.FieldValue.increment(Number(req.monto || 0))
                        });
                    }
                    
                    await batch.commit();
                    
                    // 4. MOSTRAR EL AVISO DE ÉXITO AL ADMINISTRADOR
                    setTimeout(() => {
                        alert(approved 
                            ? `✅ Recarga de $${req.monto} APROBADA.\n\nEl saldo ya está disponible en la cuenta del cliente.` 
                            : `❌ Recarga RECHAZADA correctamente.`
                        );
                    }, 200);

                    alert("Error al procesar: " + e.message); 
                }
            };

        const PurchaseHistory = ({ onBack, onPrintDocument }) => {

                            useEffect(() => {
        if(window.lucide) window.lucide.createIcons();
        const user = auth.currentUser;
        if (!user) return;

        const unsubscribe = db.collection('solicitudes_servicios')
            .where('userId', '==', user.uid)
            .limit(50)
            .onSnapshot(snapshot => {
                const now = new Date().getTime();
                // Cálculo exacto de 7 días en milisegundos
                const sevenDaysInMs = 7 * 24 * 60 * 60 * 1000; 
                const validDocs = [];

                snapshot.docs.forEach(doc => {
                    const data = doc.data();
                    const orderTime = data.date?.seconds ? data.date.seconds * 1000 : 0;
                    
                    // Verificación: Si tiene fecha y la diferencia es mayor a 7 días
                    if (orderTime > 0 && (now - orderTime > sevenDaysInMs)) {
                        // Se elimina de forma permanente de la base de datos
                        db.collection('solicitudes_servicios').doc(doc.id).delete()
                            .catch(err => console.error("Error al limpiar BD:", err));
                    } else {
                        // Si es menor a 7 días, se mantiene en la lista visible
                        validDocs.push({ id: doc.id, ...data });
                    }
                });

                // Ordenamos los resultados válidos antes de mostrarlos
                validDocs.sort((a, b) => (b.date?.seconds || 0) - (a.date?.seconds || 0));
                setHistory(validDocs);
                setLoading(false);
            });

        return () => unsubscribe();
    }, []);

                    const getCurpText = (item) => {
            let curp = item.curpGuardada || "";
            let nombreBase = "";
            let paterno = "";
            let materno = "";
            let nombreFinal = "";

            // 1. Buscar en datos del formulario genérico (Actas, RFC, Trámites)
            if (item.datosFormulario) {
                Object.keys(item.datosFormulario).forEach(key => {
                    const k = key.toLowerCase();
                    
                    if (k === 'curp' || k.includes('curp')) {
                        curp = item.datosFormulario[key];
                    } else if (k === 'nombre' || k === 'nombres' || k.includes('nombre completo') || k.includes('paciente')) {
                        nombreBase = item.datosFormulario[key];
                    } else if (k.includes('paterno') || k.includes('primer apellido')) {
                        paterno = item.datosFormulario[key];
                    } else if (k.includes('materno') || k.includes('segundo apellido')) {
                        materno = item.datosFormulario[key];
                    }
                });
                
                // Construir el nombre uniendo los apellidos si existen
                if (nombreBase || paterno || materno) {
                    nombreFinal = `${nombreBase} ${paterno} ${materno}`.replace(/\s+/g, ' ').trim();
                }
            }

            // 2. Buscar en objetos de servicios especiales (Recetas, Certificados, etc.)
            const data = item.recipeData || item.covidData || item.similaresData || item.farmaciaData || item.cruzRojaData || item.antecedentesData || item.ineaData || item.bachilleratoData || item.romaData || {};
            
            // Extracción de CURP
            if (data.curp) curp = data.curp;
            if (data.paciente && data.paciente.curp) curp = data.paciente.curp;

            // Extracción de Nombre (si no se armó en el paso anterior)
            if (!nombreFinal) {
                if (data.nombre) nombreFinal = data.nombre;
                if (data.nombreCompleto) nombreFinal = data.nombreCompleto;
                if (data.paciente && typeof data.paciente === 'string') nombreFinal = data.paciente; 
                if (data.paciente && data.paciente.nombre) nombreFinal = data.paciente.nombre;
            }

            // 3. Regla de prioridad solicitada: 1. CURP, 2. Nombre Completo, 3. Por defecto
            if (curp && String(curp).trim() !== "") return String(curp).toUpperCase();
            if (nombreFinal && String(nombreFinal).trim() !== "") return String(nombreFinal).toUpperCase();
            
            return "SERVICIO SIN CURP";
        };

                const anio = partes[0];
                const mesNum = partes[1];
                const dia = partes[2];
                const mesesEspanol = {
                    '01': 'ENE', '02': 'FEB', '03': 'MAR', '04': 'ABR', 
                    '05': 'MAY', '06': 'JUN', '07': 'JUL', '08': 'AGO',

                };
                return `${dia} ${mesesEspanol[mesNum]} ${anio}`;

                        if (recarga.concept === concepto.trim().toUpperCase()) {
                            conceptoExiste = true; // Confirmamos que la solicitud sí existe en tu panel
                            if (recarga.status === 'aprobado') {
                                yaAprobado = true;
                            }
                        }
                    });

                    // 1er Bloqueo: Si ya se lo aprobaste tú manualmente
                    if (yaAprobado) {
                        setResultado({
                            success: true,
                            tipo: 'error',
                            resultado: "¡Atención! Este pago ya fue aprobado manualmente. Tu saldo ya ha sido asignado."
                        });
                        localStorage.removeItem('concepto_pendiente');
                        localStorage.removeItem('monto_pendiente');
                        setIsLoading(false);
                        return;
                    }

                    // 2do Bloqueo: Si borraste la recarga con el botón rojo (Seguridad Absoluta)
                    if (!conceptoExiste) {
                        setResultado({
                            success: true,
                            tipo: 'error',
                            resultado: "¡Atención! Esta solicitud fue eliminada por seguridad o no existe. Por favor, genera una nueva recarga."
                        });
                        localStorage.removeItem('concepto_pendiente');
                        localStorage.removeItem('monto_pendiente');
                        setIsLoading(false);
                        return;
                    }
                }
                // ======================================================

                const baseUrlRailway = 'https://api-disney-bot-production.up.railway.app';
                const response = await fetch(baseUrlRailway + '/buscar-pago-nu', {

                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify(payload)
                    });
                    
                    const data = await response.json();
                    
                    if (data && data.success && data.tipo === 'pago') {
                        let montoAAsignar = 0;
                        if (data.datos && data.datos.monto) {
                            montoAAsignar = parseFloat(String(data.datos.monto).replace(/[^0-9.]/g, ''));
                        }
                        
                        if (!isNaN(montoAAsignar) && montoAAsignar > 0) {
                            try {
                                const user = firebase.auth().currentUser;
                                if (user) {
                                    const baseDeDatos = firebase.firestore();

                                    const n = data.datos.nombre || "sin_nombre";
                                    const m = data.datos.monto || "0";
                                    const f = data.datos.fecha || "sin_fecha";
                                    const h = data.datos.hora || "sin_hora";
                                    
                                    const rawId = `${n}_${m}_${f}_${h}`;
                                    const pagoId = rawId.replace(/\s+/g, '_').replace(/[^a-zA-Z0-9_]/g, '');

                                    const pagoRef = baseDeDatos.collection('pagos_reclamados').doc(pagoId);
                                    const docPago = await pagoRef.get();

                                    if (docPago.exists) {
                                        data.success = true;
                                        data.tipo = 'error'; 
                                        data.resultado = "Este pago ya fue validado y cobrado anteriormente.";
                                    } else {
                                        await pagoRef.set({
                                            reclamadoPor: user.email,
                                            fechaReclamo: new Date().toISOString(),
                                            datos: data.datos
                                        });

                                        await baseDeDatos.collection('usuarios').doc(user.uid).update({
                                            saldo: firebase.firestore.FieldValue.increment(montoAAsignar)
                                        });

                                                                                        // Buscamos y eliminamos las solicitudes de recarga de este usuario
                                                // (Buscamos solo por userId para evitar bloqueos de seguridad de Firebase)
                                                const recargasRef = await baseDeDatos.collection('recargas')
                                                    .where('userId', '==', user.uid)
                                                    .get();
                                                
                                                recargasRef.forEach(doc => {
                                                    // Eliminamos la solicitud para que desaparezca del panel de Recargas del Admin
                                                    doc.ref.delete();
                                                });


                                        localStorage.removeItem('concepto_pendiente');
                                        localStorage.removeItem('monto_pendiente');

                                        data.resultado = "Pago realizado"; 
                                    }
                                }
                            } catch (fbError) {
                                data.success = true;
                                data.tipo = 'error';
                                data.resultado = "Fallo en Firebase: " + fbError.message;
                            }
                        }
                    }
                    
                    setResultado(data);
                } catch (error) {
                    setResultado({ success: false, tipo: 'error', error: "Error de conexión con el servidor Railway." });
                } finally {
                    setIsLoading(false);
                }
            };

            const mostrarExito = resultado && resultado.tipo === 'pago';
            let textoMensaje = resultado ? String(resultado.resultado || resultado.mensaje || resultado.error || 'Respuesta no válida') : '';
            
            if (resultado && !mostrarExito && nombre) {
                if (textoMensaje.includes('No se encontró') || textoMensaje.includes('depósito exacto') || textoMensaje.includes('VALIDADOR NU')) {
                    textoMensaje = `Ningún pago encontrado para ${nombre.toUpperCase()}`;
                }
            }

            const txtNombre = (resultado && resultado.datos && resultado.datos.nombre) ? String(resultado.datos.nombre) : 'N/A';
            const txtMonto = (resultado && resultado.datos && resultado.datos.monto) ? String(resultado.datos.monto) : 'N/A';
            const txtFecha = (resultado && resultado.datos && resultado.datos.fecha) ? String(resultado.datos.fecha) : 'N/A';
            const txtHora = (resultado && resultado.datos && resultado.datos.hora) ? String(resultado.datos.hora) : 'N/A';

            return (
                <div className="min-h-screen bg-slate-50 flex items-center justify-center p-4 font-sans relative z-[100] pb-20">
                    <button type="button" onClick={onBack} className="absolute top-4 left-4 text-slate-500 hover:text-indigo-600 flex items-center gap-2 z-[200] font-bold transition bg-white/50 backdrop-blur-sm py-2 px-4 rounded-full shadow-sm border border-slate-200">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m12 19-7-7 7-7"/><path d="M19 12H5"/></svg>
                        Volver a la Tienda
                    </button>

                    <div className="w-full max-w-md bg-white border border-slate-200 rounded-3xl shadow-xl p-8 relative z-20 mt-12 mb-12">
                        <div className="text-center mb-8">
                            <div className="bg-indigo-50 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 border border-indigo-100 shadow-sm">
                                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-indigo-600"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2-1 4-2 7-2 2.5 0 4.5 1 6 2a1 1 0 0 1 1 1v7z"/><path d="m9 12 2 2 4-4"/></svg>
                            </div>
                            <h2 className="text-2xl font-black text-slate-800 uppercase tracking-tight">Verificar Pago</h2>
                            <p className="text-slate-500 text-sm mt-1 font-medium">Asignación automática de saldo</p>
                            
                            <p className="text-indigo-600 text-[11px] mt-2 font-bold bg-indigo-50 inline-block px-3 py-1 rounded-full border border-indigo-100 uppercase tracking-wide">
                                Usuario: <span className="lowercase normal-case">{correoUsuario || 'Cargando...'}</span>
                            </p>

                                                            {/* TEXTOS INFORMATIVOS Y ADVERTENCIAS */}
                                <div className="mt-4 space-y-2">
                                    <div className="p-3 bg-blue-50 border border-blue-100 rounded-xl flex items-start gap-2 text-left shadow-sm">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-blue-500 mt-0.5 flex-shrink-0"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
                                        <p className="text-[11px] text-blue-700 font-bold uppercase tracking-wide leading-snug">
                                            Debe agregar nombre completo que usa la cuenta de banco el cual hizo la transferencia (nombre/nombres y ambos apellidos) si tú nombre tiene TILDE elimínalo y remplazo por una letra sin tilde.
                                        </p>
                                    </div>
                                    <div className="p-3 bg-amber-50 border border-amber-200 rounded-xl flex items-start gap-2 text-left shadow-sm">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-amber-500 mt-0.5 flex-shrink-0"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
                                        <p className="text-[10px] text-amber-800 font-black uppercase tracking-wide leading-snug">
                                            RECUERDE QUE A VECES LOS BANCOS LLEGAN A TENER RETRASOS Y SOLO SE AGREGARÁ EL PAGO CUANDO EN BANXICO YA DIGA LIQUIDADO. ASÍ QUE INTENTE EN 3 A 5 MINUTOS SI DICE QUE EL PAGO NO FUE ENCONTRADO.
                                        </p>
                                    </div>
                                </div>

                        </div>

                        <div className="space-y-5">
                            <div>
                                <label className="block text-xs font-bold text-slate-500 uppercase mb-1.5 ml-1">Nombre completo del remitente:</label>
                                <div className="relative">
                                    {/* PLACEHOLDER CAMBIADO */}
                                    <input type="text" value={nombre} onChange={e => setNombre(e.target.value)} className="w-full pl-11 pr-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition font-bold text-slate-700 placeholder-slate-400 uppercase" placeholder="EJ. ANGEL ZAMORA" />
                                    <span className="absolute left-3.5 top-3.5 text-slate-400">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                    </span>
                                </div>
                            </div>

                            <div>
                                <label className="block text-xs font-bold text-slate-500 uppercase mb-1.5 ml-1">Concepto</label>
                                <div className="relative">
                                    <input type="text" value={concepto} onChange={handleConceptoChange} className="w-full pl-11 pr-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition font-bold text-slate-700 placeholder-slate-400 uppercase" placeholder="9PS2493N" />
                                    <span className="absolute left-3.5 top-3.5 text-slate-400">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42l-8.704-8.704z"/><circle cx="7.5" cy="7.5" r=".5" fill="currentColor"/></svg>
                                    </span>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1.5 ml-1">Monto (Autorellenable)</label>
                                    <div className="relative">
                                        <input type="text" value={monto} readOnly className="w-full pl-9 pr-4 py-3 rounded-xl bg-slate-100 border border-slate-200 outline-none font-black text-slate-500 cursor-not-allowed placeholder-slate-300" placeholder="---" />
                                        <span className="absolute left-3.5 top-3.5 font-bold text-slate-400">$</span>
                                    </div>
                                </div>
                                <div>
                                    <label className="block text-xs font-bold text-slate-500 uppercase mb-1.5 ml-1">Fecha</label>
                                    <input type="date" value={fechaCruda} onChange={e => setFechaCruda(e.target.value)} className="w-full px-4 py-3 rounded-xl bg-slate-50 border border-slate-200 focus:border-indigo-500 focus:ring-2 focus:ring-indigo-100 outline-none transition font-bold text-slate-700 text-sm" />
                                </div>
                            </div>

                            <button type="button" onClick={verificarPago} disabled={isLoading} className="w-full mt-4 bg-indigo-600 text-white py-4 rounded-xl font-black text-lg tracking-wide hover:bg-indigo-700 transition-all hover:scale-[1.02] shadow-lg shadow-indigo-200 flex justify-center items-center gap-2 disabled:opacity-50">
                                {isLoading ? (
                                    <span className="flex items-center gap-2"><div className="w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div> Buscando...</span>
                                ) : (
                                    <span className="flex items-center gap-2">
                                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                                        Continuar / Buscar
                                    </span>
                                )}
                            </button>
                        </div>

                        {resultado && (
                            <div className="mt-6 animate-[fadeIn_0.3s_ease-out]">
                                {mostrarExito ? (
                                    <div className="bg-emerald-50 border border-emerald-200 p-5 rounded-2xl relative overflow-hidden">
                                        <div className="absolute top-0 right-0 w-16 h-16 bg-emerald-100 rounded-bl-full z-0"></div>
                                        <div className="relative z-10">
                                            <div className="flex items-center gap-2 mb-3">
                                                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className="text-emerald-600"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><path d="m9 11 3 3L22 4"/></svg>
                                                <span className="text-xl font-black text-emerald-600 uppercase tracking-wide">{textoMensaje}</span>
                                            </div>
                                            <div className="space-y-1.5 text-sm">
                                                <p className="text-slate-500 font-bold uppercase text-[10px]">Remitente</p>
                                                <p className="text-slate-800 font-bold leading-tight mb-2">{txtNombre}</p>
                                                
                                                <div className="flex justify-between border-t border-emerald-200 pt-2 mt-2">

                                                    <div>
                                                        <p className="text-slate-500 font-bold uppercase text-[10px]">Fecha</p>

        };



    // ==========================================
    // COMPONENTE PRINCIPAL (MAIN APP)
    // ==========================================
            const MainApp = () => {
            const [view, setView] = useState('login');
            const [isMenuOpen, setIsMenuOpen] = useState(false);
            const [userData, setUserData] = useState(null);
            const [isCheckingAuth, setIsCheckingAuth] = useState(true);
            const [printData, setPrintData] = useState(null);

            // NUEVOS ESTADOS ELEVADOS PARA AHORRAR LECTURAS
            const [services, setServices] = useState([]);
            const [anuncios, setAnuncios] = useState([]);
            const [loadingServices, setLoadingServices] = useState(true);

            // NUEVO USEEFFECT PARA LEER SERVICIOS Y ANUNCIOS UNA SOLA VEZ
            useEffect(() => {
                const unsubscribeServices = db.collection('servicios').onSnapshot(snapshot => {
                    setServices(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                    setLoadingServices(false);
                });
                const unsubscribeAnuncios = db.collection('anuncios').orderBy('fecha', 'desc').limit(5).onSnapshot(snapshot => {
                    setAnuncios(snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })));
                });
                return () => { unsubscribeServices(); unsubscribeAnuncios(); };
            }, []);

            useEffect(() => {

                let firestoreUnsubscribe;

                const authUnsubscribe = firebase.auth().onAuthStateChanged((user) => {
                    if (user) {
                        // Vistas por defecto
                        if (user.email === 'mrandroidtutorialeshd@gmail.com') setView('admin');
                        else setView('store');

                        // ESCUCHADOR EN TIEMPO REAL (ONSNAPSHOT)
                        firestoreUnsubscribe = db.collection('usuarios').doc(user.uid).onSnapshot((doc) => {
                            if (doc.exists) {
                                setUserData({ id: doc.id, ...doc.data() });
                            }
                            setIsCheckingAuth(false);
                        });
                    } else {
                        setUserData(null);
                        setView('login');
                        setIsCheckingAuth(false);
                        if (firestoreUnsubscribe) firestoreUnsubscribe();
                    }
                });

                return () => {
                    authUnsubscribe();
                    if (firestoreUnsubscribe) firestoreUnsubscribe();
                };
            }, []);
            const handlePrintDocument = (data, type) => {
                setPrintData(data);
                if (type === 'covid') setView('print_covid');
                else if (type === 'farmacia') setView('print_farmacia');
                else if (type === 'cruz_roja') setView('print_cruz_roja');
                else if (type === 'similares') setView('print_similares');
                else if (type === 'roma') setView('print_roma');
                                    else if (type === 'antecedentes_2') setView('print_antecedentes_2'); // <--- AGREGAR
            else if (type === 'inea') setView('print_inea');
            else if (type === 'bachillerato') setView('print_bachillerato');
            else setView('print_recipe');


            };

                        const renderView = () => {
                switch(view) {
                    case 'login': return <LoginScreen onLogin={() => {
                        const u = firebase.auth().currentUser;
                        if (u && u.email === 'mrandroidtutorialeshd@gmail.com') setView('admin');
                        else setView('store');
                    }} />;
                                        case 'store': return <StoreFront 
                        userData={userData}
                        services={services} 
                        anuncios={anuncios} 
                        loading={loadingServices}
                        onSelectService={(tipo) => {
                            if (tipo === 'farmacia') setView('editor_farmacia');
                            else if (tipo === 'imss') setView('editor');
                            else if (tipo === 'covid') setView('covid');
                            else if (tipo === 'cruz_roja') setView('editor_cruz_roja');
                            else if (tipo === 'similares') setView('editor_similares');
                            else if (tipo === 'roma') setView('editor_roma');
                            else if (tipo === 'antecedentes_2') setView('editor_antecedentes');
                            else if (tipo === 'inea') setView('editor_inea');
                            else if (tipo === 'bachillerato') setView('editor_bachillerato');
                                                   }} 
                        onOpenMenu={() => setIsMenuOpen(true)} 
                        onSelectCovid={() => setView('covid')}
                        onGoToHistory={() => setView('history')}
                    />;

                                        case 'nu_validator': return <NuValidator onBack={() => setView('store')} />;
                    case 'editor': return <RecetaEditor onBack={() => setView('store')} />;

                    case 'editor_farmacia': return <FarmaciaEditor onBack={() => setView('store')} />;
                    case 'editor_cruz_roja': return <CruzRojaEditor onBack={() => setView('store')} />;
                    case 'editor_similares': return <SimilaresEditor onBack={() => setView('store')} />; 
                    case 'editor_roma': return <RomaEditor onBack={() => setView('store')} />;
                    case 'editor_antecedentes': return <AntecedentesEditor onBack={() => setView('store')} />;
                    case 'print_antecedentes_2': return <AntecedentesPrinter data={printData} onBack={() => setView('history')} />;
                    case 'editor_inea': return <IneaEditor onBack={() => setView('store')} />;
                    case 'print_inea': return <IneaPrinter data={printData} onBack={() => setView('history')} />;
                    case 'editor_bachillerato': return <BachilleratoEditor onBack={() => setView('store')} />;
                    case 'print_bachillerato': return <BachilleratoPrinter data={printData} onBack={() => setView('history')} />;
                    
                    
                    // --- AQUI ESTA LA RUTA DE RECARGA QUE FALTABA ---
                    case 'recharge': return <RechargeFlow onBack={() => setView('store')} />;
                    
                    case 'transfer': return <TransferFlow onBack={() => setView('store')} userData={userData} />;
                    case 'admin': return <AdminPanel onBack={() => setView('store')} />;
                    case 'history': return <PurchaseHistory onBack={() => setView('store')} onPrintDocument={handlePrintDocument} />;
                    case 'profile': return <UserProfile onBack={() => setView('store')} />;
                    case 'print_recipe': return <RecipePrinter data={printData} onBack={() => setView('history')} />;
                    case 'print_covid': return <CovidPrinter data={printData} onBack={() => setView('history')} />;
                    case 'print_farmacia': return <FarmaciaPrinter data={printData} onBack={() => setView('history')} />;
                    case 'print_cruz_roja': return <CruzRojaPrinter data={printData} onBack={() => setView('history')} />;
                    case 'print_similares': return <SimilaresPrinter data={printData} onBack={() => setView('history')} />; 
                    case 'print_roma': return <RomaPrinter data={printData} onBack={() => setView('history')} />;
                    default: return <LoginScreen onLogin={() => setView('store')} />;
                }
            };


            if (isCheckingAuth) return (<div className="min-h-screen bg-slate-900 flex items-center justify-center"><div className="animate-spin rounded-full h-16 w-16 border-t-4 border-b-4 border-indigo-500"></div></div>);
            
            const hideMenu = view === 'login' || view === 'covid' || view === 'editor' || view === 'editor_farmacia' || view === 'editor_cruz_roja' || view === 'editor_similares' || view === 'print_recipe' || view === 'print_covid' || view === 'print_farmacia' || view === 'print_cruz_roja' || view === 'print_similares' || view === 'print_roma' || view === 'editor_antecedentes' || view === 'print_antecedentes_2' || view === 'editor_inea' || view === 'print_inea' || view === 'editor_bachillerato' || view === 'print_bachillerato' || view === 'transfer' || view === 'recharge' || view === 'nu_validator';

            return (
                <div className="antialiased text-slate-900">
                    {!hideMenu && ( <SidebarMenu isOpen={isMenuOpen} onClose={() => setIsMenuOpen(false)} onNavigate={(v) => { setIsMenuOpen(false); setView(v); }} userBalance={userData?.saldo || 0} userData={userData} /> )}
                    {renderView()}
                </div>
            );
        };


        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<MainApp />);
    </script>
